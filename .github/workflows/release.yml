name: Release

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: "Build ARM64 architecture (slower, ~5min extra)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}
jobs:
  # Initial repository check guard
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # Build, sign, and push Docker images
  build-and-release:
    name: Build & Release
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      platforms: ${{ steps.prep.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare derived values
        id: prep
        env:
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Set APP_DOMAIN with validation; avoid silent localhost fallback for real releases
          APP_DOMAIN="${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}"
          if [ -z "$APP_DOMAIN" ] || [ "$APP_DOMAIN" = "null" ]; then
            if [ "${{ env.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK || vars.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK }}" != "true" ]; then
              echo "::warning::NEXT_PUBLIC_APP_DOMAIN (repo variable) is not configured. Falling back to APP_DOMAIN=localhost."
              echo "::warning::To explicitly allow this fallback without warnings, set vars.ALLOW_APP_DOMAIN_LOCALHOST_FALLBACK=true."
            fi
            APP_DOMAIN="localhost"
          fi
          echo "APP_DOMAIN=${APP_DOMAIN}" >> $GITHUB_ENV

          # Derive BACKEND_URL if not set
          BACKEND_URL="${{ env.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ] || [ "$BACKEND_URL" = "null" ]; then
             if [ "$APP_DOMAIN" = "localhost" ]; then
               BACKEND_URL="http://localhost:3000"
             else
               BACKEND_URL="https://${APP_DOMAIN}"
             fi
          fi
          echo "BACKEND_URL=${BACKEND_URL}" >> $GITHUB_ENV
          IMAGE_NAME=$(echo "$REPO" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # Debug: Show what will be used
          echo "🐳 Image name: ${IMAGE_NAME}"
          echo "   Full path: ghcr.io/${REPO_OWNER}/${IMAGE_NAME}"

          # Determine build platforms
          if [ "${{ github.event_name }}" == "push" ]; then
            PLATFORMS="linux/amd64"
            echo "📦 Main push detected - building amd64 only"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.build_arm64 }}" == "true" ]; then
              PLATFORMS="linux/amd64,linux/arm64"
              echo "📦 Manual dispatch with ARM64 enabled"
            else
              PLATFORMS="linux/amd64"
              echo "📦 Manual dispatch - AMD64 only (faster build)"
            fi
          else
            PLATFORMS="linux/amd64"
          fi
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "  Build platforms: ${PLATFORMS}"

          echo "app_url=https://${APP_DOMAIN}" >> $GITHUB_OUTPUT
          echo "sitemap_url=https://${APP_DOMAIN}/sitemap.xml" >> $GITHUB_OUTPUT
          echo "app_email=@${APP_DOMAIN}" >> $GITHUB_OUTPUT
          echo "legal_email=legal@${APP_DOMAIN}" >> $GITHUB_OUTPUT
          
          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          if [ -z "$TIMESTAMP" ] || [ "$TIMESTAMP" == "null" ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "created=$TIMESTAMP" >> $GITHUB_OUTPUT

          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "source_date_epoch=${SOURCE_DATE_EPOCH}" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:latest
          secrets: |
            sentry_token=${{ env.SENTRY_AUTH_TOKEN || secrets.SENTRY_AUTH_TOKEN }}
          platforms: ${{ steps.prep.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_COMMIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.prep.outputs.source_date_epoch }}
            NEXT_PUBLIC_BACKEND_URL=${{ env.NEXT_PUBLIC_BACKEND_URL || vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_SUPABASE_CF_PROXY_URL=${{ env.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_CF_PROXY_URL }}
            NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL=${{ env.NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL || vars.NEXT_PUBLIC_SUPABASE_AWS_PROXY_URL }}
            NEXT_PUBLIC_GITHUB_URL=${{ env.NEXT_PUBLIC_GITHUB_URL || vars.NEXT_PUBLIC_GITHUB_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ env.NEXT_PUBLIC_SENTRY_DSN || vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY || vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GA_ID=${{ env.NEXT_PUBLIC_GA_ID || vars.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_ANDROID_PACKAGE_NAME=${{ env.NEXT_PUBLIC_ANDROID_PACKAGE_NAME || vars.NEXT_PUBLIC_ANDROID_PACKAGE_NAME }}
            SENTRY_ORG=${{ env.SENTRY_ORG || vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ env.SENTRY_PROJECT || vars.SENTRY_PROJECT }}
            NEXT_PUBLIC_APP_NAME=${{ env.NEXT_PUBLIC_APP_NAME || vars.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_APP_VERSION=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}
            MIN_APP_VERSION=${{ env.MIN_APP_VERSION || vars.MIN_APP_VERSION || 'latest' }}
            NEXT_PUBLIC_APP_DOMAIN=${{ env.NEXT_PUBLIC_APP_DOMAIN || vars.NEXT_PUBLIC_APP_DOMAIN }}
            NEXT_PUBLIC_AUTHOR_NAME=${{ env.NEXT_PUBLIC_AUTHOR_NAME || vars.NEXT_PUBLIC_AUTHOR_NAME }}
            NEXT_PUBLIC_AUTHOR_URL=${{ env.NEXT_PUBLIC_AUTHOR_URL || vars.NEXT_PUBLIC_AUTHOR_URL }}
            NEXT_PUBLIC_APP_URL=${{ steps.prep.outputs.app_url }}
            NEXT_PUBLIC_SITEMAP_URL=${{ steps.prep.outputs.sitemap_url }}
            NEXT_PUBLIC_APP_EMAIL=${{ steps.prep.outputs.app_email }}
            NEXT_PUBLIC_LEGAL_EMAIL=${{ steps.prep.outputs.legal_email }}
            NEXT_PUBLIC_DONATE_URL=${{ env.NEXT_PUBLIC_DONATE_URL || vars.NEXT_PUBLIC_DONATE_URL }}
            NEXT_PUBLIC_DEFAULT_DOMAIN=${{ env.NEXT_PUBLIC_DEFAULT_DOMAIN || vars.NEXT_PUBLIC_DEFAULT_DOMAIN }}
            NEXT_PUBLIC_ATTENDANCE_TARGET_MIN=${{ env.NEXT_PUBLIC_ATTENDANCE_TARGET_MIN || vars.NEXT_PUBLIC_ATTENDANCE_TARGET_MIN }}
            NEXT_PUBLIC_SENTRY_REPLAY_RATE=${{ env.NEXT_PUBLIC_SENTRY_REPLAY_RATE || vars.NEXT_PUBLIC_SENTRY_REPLAY_RATE }}
            NEXT_PUBLIC_FORCE_STRICT_CSP=${{ env.NEXT_PUBLIC_FORCE_STRICT_CSP || vars.NEXT_PUBLIC_FORCE_STRICT_CSP }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_RUN_ID=${{ github.run_id }}
            GITHUB_RUN_NUMBER=${{ github.run_number }}
            BUILD_TIMESTAMP=${{ steps.prep.outputs.created }}
            AUDIT_STATUS=PASSED
            SIGNATURE_STATUS=SLSA_PROVENANCE_GENERATED
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.version=${{ env.NEXT_PUBLIC_APP_VERSION || vars.NEXT_PUBLIC_APP_VERSION || 'latest' }}

      # Attest build provenance
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Download SLSA provenance attestation for OpenSSF Scorecard
      - name: Download SLSA provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Downloading SLSA Provenance Attestation ==="

          # Retry logic: attestation may take a moment to be available
          MAX_ATTEMPTS=5
          ATTEMPT=1
          SLEEP_TIME=10

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if gh attestation download \
              oci://ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }} \
              --owner ${{ github.repository_owner }}; then
              shopt -s nullglob
              digest_files=(sha256*.jsonl)
              if [ ${#digest_files[@]} -gt 0 ]; then
                DIGEST_FILE="${digest_files[0]}"
              else
                DIGEST_FILE=""
              fi
              if [ -n "$DIGEST_FILE" ]; then
                mv "$DIGEST_FILE" provenance.intoto.jsonl
                echo "✓ SLSA provenance attestation downloaded successfully"
                ls -lh provenance.intoto.jsonl
                exit 0
              else
                echo "⚠ Could not find downloaded attestation file"
                echo "Current directory contents:"
                ls -la
                echo "Waiting ${SLEEP_TIME}s before retry..."
                sleep $SLEEP_TIME
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
            else
              echo "⚠ Download failed, waiting ${SLEEP_TIME}s before retry..."
              sleep $SLEEP_TIME
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          echo "❌ Failed to download attestation after $MAX_ATTEMPTS attempts"
          exit 1

      # Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.json

      # Attest SBOM
      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: sbom.json
          push-to-registry: true

      # Sign image with cosign (keyless signing using OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Authenticate cosign with registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign the published Docker image
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}"
