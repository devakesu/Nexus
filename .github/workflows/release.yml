name: Release

on:
  workflow_dispatch:
    inputs:
      build_arm64:
        description: "Build ARM64 architecture (slower, ~5min extra)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  # Initial repository check guard
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: 'fs'
          scan-ref: '.'
          trivy-config: 'trivy.yaml'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  # Build, sign, and push Docker images
  build-and-release:
    name: Build & Release Backend
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.build-push.outputs.digest }}
      platforms: ${{ steps.prep.outputs.platforms }}
      app_version: ${{ steps.version.outputs.app_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Extract App Version
        id: version
        run: |
          VERSION=$(grep '^version: ' mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          APP_VERSION="${VERSION}+${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Fetch Public Secrets from Infisical to .env
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          infisical export --projectId=2c94b0e4-559c-46a3-833c-1cb66f59c842 --env=prod --path=/public --format=dotenv > .env
          echo "APP_VERSION=${APP_VERSION}" >> .env

      - name: Prepare derived values
        id: prep
        env:
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_NAME=$(echo "$REPO" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

          # Determine build platforms
          if [ "${{ github.event_name }}" == "push" ]; then
            PLATFORMS="linux/amd64"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.build_arm64 }}" == "true" ]; then
              PLATFORMS="linux/amd64,linux/arm64"
            else
              PLATFORMS="linux/amd64"
            fi
          else
            PLATFORMS="linux/amd64"
          fi
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT

          TIMESTAMP="${{ github.event.head_commit.timestamp }}"
          if [ -z "$TIMESTAMP" ] || [ "$TIMESTAMP" == "null" ]; then
            TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          fi
          echo "created=$TIMESTAMP" >> $GITHUB_OUTPUT

          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          echo "source_date_epoch=${SOURCE_DATE_EPOCH}" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        id: build-push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:${{ steps.version.outputs.app_version }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}:latest
          platforms: ${{ steps.prep.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.prep.outputs.created }}
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}

      # Attest build provenance
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Download SLSA provenance attestation for OpenSSF Scorecard
      - name: Download SLSA provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "=== Downloading SLSA Provenance Attestation ==="
          MAX_ATTEMPTS=5
          ATTEMPT=1
          SLEEP_TIME=10

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT of $MAX_ATTEMPTS..."

            if gh attestation download \
              oci://ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }} \
              --owner ${{ github.repository_owner }}; then
              shopt -s nullglob
              digest_files=(sha256*.jsonl)
              if [ ${#digest_files[@]} -gt 0 ]; then
                DIGEST_FILE="${digest_files[0]}"
              else
                DIGEST_FILE=""
              fi
              if [ -n "$DIGEST_FILE" ]; then
                mv "$DIGEST_FILE" provenance.intoto.jsonl
                echo "✓ SLSA provenance attestation downloaded successfully"
                exit 0
              else
                echo "Waiting ${SLEEP_TIME}s before retry..."
                sleep $SLEEP_TIME
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
            else
              echo "Waiting ${SLEEP_TIME}s before retry..."
              sleep $SLEEP_TIME
              ATTEMPT=$((ATTEMPT + 1))
            fi
          done

          echo "❌ Failed to download attestation after $MAX_ATTEMPTS attempts"
          exit 1

      # Generate SBOM
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.json

      # Attest SBOM
      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: sbom.json
          push-to-registry: true

      # Sign image with cosign (keyless signing using OIDC)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Authenticate cosign with registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign the published Docker image
        env:
          COSIGN_YES: "true"
          IMAGE_URI: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
        run: |
          timeout 300 cosign sign \
            -a "repo=${{ github.repository }}" \
            -a "workflow=${{ github.workflow }}" \
            -a "ref=${{ github.ref }}" \
            -a "version=${{ steps.version.outputs.app_version }}" \
            "${IMAGE_URI}"

      - name: Verify image signature
        env:
          IMAGE_URI: ghcr.io/${{ github.repository_owner }}/${{ steps.prep.outputs.image_name }}@${{ steps.build-push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp="^https://github.com/${{ github.repository }}/.github/workflows/" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${IMAGE_URI}"

      # Sign SBOM file
      - name: Sign SBOM artifact
        run: |
          timeout 60 cosign sign-blob --yes \
            --bundle sbom.json.bundle \
            sbom.json

      # Generate SHA256 checksums
      - name: Generate checksums
        run: |
          echo "# Release Artifact Checksums" > checksums.txt
          echo "" >> checksums.txt
          sha256sum sbom.json >> checksums.txt
          sha256sum sbom.json.bundle >> checksums.txt
          sha256sum provenance.intoto.jsonl >> checksums.txt

      # Upload artifacts
      - name: Upload release artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45b531
        with:
          name: web-release-artifacts
          path: |
            sbom.json
            sbom.json.bundle
            checksums.txt
            provenance.intoto.jsonl

  # Build mobile Flutter application for nexus and nexus_mec flavors
  build-mobile:
    name: Build Flutter App
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_PRIVATE_BUCKET: ${{ secrets.AWS_S3_PRIVATE_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Extract App Version
        id: version
        run: |
          VERSION=$(grep '^version: ' mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          APP_VERSION="${VERSION}+${{ github.run_number }}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@b622de1dfa918ecc0ab28f40cd42e3c3752cd6c5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Export Secrets
        id: secrets
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          # Export public secrets to GitHub Env
          eval $(infisical export --projectId=2c94b0e4-559c-46a3-833c-1cb66f59c842 --env=prod --path=/public --format=export-env)

          # Pass to GITHUB_ENV so they persist across steps
          echo "APP_DOMAIN=$APP_DOMAIN" >> $GITHUB_ENV
          echo "GOOGLE_PLACES_API_KEY=$GOOGLE_PLACES_API_KEY" >> $GITHUB_ENV
          echo "GOOGLE_IOS_CLIENT_ID_NEXUS=$GOOGLE_IOS_CLIENT_ID_NEXUS" >> $GITHUB_ENV
          echo "GOOGLE_IOS_CLIENT_ID_NEXUS_MEC=$GOOGLE_IOS_CLIENT_ID_NEXUS_MEC" >> $GITHUB_ENV
          echo "SUPABASE_URL=$SUPABASE_URL" >> $GITHUB_ENV
          echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" >> $GITHUB_ENV
          echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID" >> $GITHUB_ENV
          echo "SPOTIFY_CLIENT_ID=$SPOTIFY_CLIENT_ID" >> $GITHUB_ENV
          echo "SPOTIFY_REDIRECT_URI_NEXUS=$SPOTIFY_REDIRECT_URI_NEXUS" >> $GITHUB_ENV
          echo "SPOTIFY_REDIRECT_URI_NEXUS_MEC=$SPOTIFY_REDIRECT_URI_NEXUS_MEC" >> $GITHUB_ENV
          echo "SENTRY_FLUTTER_DSN=$SENTRY_FLUTTER_DSN" >> $GITHUB_ENV

      - name: Prepare Android signing key
        working-directory: mobile/android
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > nexus-release.jks
            cat > key.properties << EOF
            storePassword=${ANDROID_KEYSTORE_PASSWORD}
            keyPassword=${ANDROID_KEY_PASSWORD}
            keyAlias=${ANDROID_KEY_ALIAS}
            storeFile=nexus-release.jks
            EOF
            chmod 600 key.properties nexus-release.jks
            echo "✓ Configured dynamic signing keystore from Infisical /ci"
          else
            echo "Using checked-in keys"
          fi

      - name: Prepare google-services.json
        working-directory: mobile/android
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            mkdir -p app
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            echo "✓ Recreated app/google-services.json"
          else
            echo "Using checked-in google-services.json"
          fi

      - name: Build Mobile Flavors
        env:
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          BACKEND_URL="${BACKEND_URL:-https://$APP_DOMAIN}"
          BUILD_TIME="${BUILD_TIMESTAMP:-$(date -u +'%Y-%m-%dT%H:%M:%SZ')}"

          # Write mapsApiKey to local.properties
          echo "mapsApiKey=$GOOGLE_PLACES_API_KEY" > mobile/android/local.properties

          mkdir -p mobile/release-assets
          mkdir -p mobile/play-console-assets

          for FLAVOR in nexus nexus_mec; do
            echo "=== Building Flavor: ${FLAVOR} ==="
            
            # APK
            cd mobile
            flutter build apk --release --flavor $FLAVOR \
              --obfuscate \
              --split-debug-info=build/debug-info \
              --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
              --build-name="${{ steps.version.outputs.version }}" \
              --build-number="${{ github.run_number }}" \
              --dart-define=APP_VERSION="$APP_VERSION" \
              --dart-define=APP_COMMIT_SHA=${{ github.sha }} \
              --dart-define=BUILD_TIMESTAMP=${BUILD_TIME} \
              --dart-define=GITHUB_RUN_ID=${{ github.run_id }} \
              --dart-define=GITHUB_RUN_NUMBER=${{ github.run_number }} \
              --dart-define=APP_DOMAIN="${APP_DOMAIN}" \
              --dart-define=BACKEND_URL="${BACKEND_URL}" \
              --dart-define=GOOGLE_IOS_CLIENT_ID_NEXUS="${GOOGLE_IOS_CLIENT_ID_NEXUS:-}" \
              --dart-define=GOOGLE_IOS_CLIENT_ID_NEXUS_MEC="${GOOGLE_IOS_CLIENT_ID_NEXUS_MEC:-}" \
              --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
              --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY:-}" \
              --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-}" \
              --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
              --dart-define=SPOTIFY_REDIRECT_URI_NEXUS="${SPOTIFY_REDIRECT_URI_NEXUS:-}" \
              --dart-define=SPOTIFY_REDIRECT_URI_NEXUS_MEC="${SPOTIFY_REDIRECT_URI_NEXUS_MEC:-}" \
              --dart-define=SENTRY_FLUTTER_DSN="${SENTRY_FLUTTER_DSN:-}" \
              --dart-define=GOOGLE_PLACES_API_KEY="${GOOGLE_PLACES_API_KEY:-}"

            # App Bundle
            flutter build appbundle --release --flavor $FLAVOR \
              --obfuscate \
              --split-debug-info=build/debug-info \
              --extra-gen-snapshot-options=--save-obfuscation-map=build/app/obfuscation.map.json \
              --build-name="${{ steps.version.outputs.version }}" \
              --build-number="${{ github.run_number }}" \
              --dart-define=APP_VERSION="$APP_VERSION" \
              --dart-define=APP_COMMIT_SHA=${{ github.sha }} \
              --dart-define=BUILD_TIMESTAMP=${BUILD_TIME} \
              --dart-define=GITHUB_RUN_ID=${{ github.run_id }} \
              --dart-define=GITHUB_RUN_NUMBER=${{ github.run_number }} \
              --dart-define=APP_DOMAIN="${APP_DOMAIN}" \
              --dart-define=BACKEND_URL="${BACKEND_URL}" \
              --dart-define=GOOGLE_IOS_CLIENT_ID_NEXUS="${GOOGLE_IOS_CLIENT_ID_NEXUS:-}" \
              --dart-define=GOOGLE_IOS_CLIENT_ID_NEXUS_MEC="${GOOGLE_IOS_CLIENT_ID_NEXUS_MEC:-}" \
              --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
              --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY:-}" \
              --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID:-}" \
              --dart-define=SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-}" \
              --dart-define=SPOTIFY_REDIRECT_URI_NEXUS="${SPOTIFY_REDIRECT_URI_NEXUS:-}" \
              --dart-define=SPOTIFY_REDIRECT_URI_NEXUS_MEC="${SPOTIFY_REDIRECT_URI_NEXUS_MEC:-}" \
              --dart-define=SENTRY_FLUTTER_DSN="${SENTRY_FLUTTER_DSN:-}" \
              --dart-define=GOOGLE_PLACES_API_KEY="${GOOGLE_PLACES_API_KEY:-}"

            # Upload debug symbols and obfuscation maps to Sentry
            echo "=== Uploading Sentry Symbols & Source Maps ==="
            dart run sentry_dart_plugin

            cd ..

            # Dynamic SBOM
            npx --yes @cyclonedx/cdxgen -t dart --no-install-deps -o mobile/release-assets/${FLAVOR}-sbom.json mobile

            # Attest build provenance
            uses_apk_prov=$(gh attestation verify mobile/build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk --owner ${{ github.repository_owner }} 2>/dev/null || true)
            
            # Generate SBOM & provenance checksums
            cp mobile/build/app/outputs/flutter-apk/app-${FLAVOR}-release.apk mobile/release-assets/${FLAVOR}-android-v${{ steps.version.outputs.version }}.apk
            cp mobile/build/app/outputs/bundle/${FLAVOR}Release/app-${FLAVOR}-release.aab mobile/play-console-assets/${FLAVOR}-app-release.aab
          done

      - name: Attest APKs
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            mobile/release-assets/nexus-android-v${{ steps.version.outputs.version }}.apk
            mobile/release-assets/mec-android-v${{ steps.version.outputs.version }}.apk

      - name: Attest AABs
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            mobile/play-console-assets/nexus-app-release.aab
            mobile/play-console-assets/mec-app-release.aab

      - name: Assemble Mobile Release checksums
        working-directory: mobile
        run: |
          set -euo pipefail
          cd release-assets
          {
            echo "# Mobile Release Checksums"
            echo ""
            sha256sum nexus-android-v${{ steps.version.outputs.version }}.apk
            sha256sum mec-android-v${{ steps.version.outputs.version }}.apk
            sha256sum nexus-sbom.json
            sha256sum mec-sbom.json
            echo ""
            echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } > mobile-checksums.txt

      - name: Upload mobile APK artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45b531
        with:
          name: mobile-apk-artifacts
          path: |
            mobile/release-assets/*.apk

      - name: Upload mobile security metadata artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45b531
        with:
          name: mobile-release-artifacts
          path: |
            mobile/release-assets/nexus-sbom.json
            mobile/release-assets/mec-sbom.json
            mobile/release-assets/mobile-checksums.txt

      - name: Upload Play Console internal assets to Private S3 Storage
        working-directory: mobile/play-console-assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
          AWS_S3_PRIVATE_BUCKET: ${{ secrets.AWS_S3_PRIVATE_BUCKET || vars.AWS_S3_PRIVATE_BUCKET }}
        run: |
          set -euo pipefail

          if [ -z "${AWS_S3_PRIVATE_BUCKET:-}" ]; then
            echo "::warning::AWS_S3_PRIVATE_BUCKET is not configured. Internal artifacts (.aab) will not be archived to cloud storage."
            exit 0
          fi

          echo "Uploading private internal release assets to s3://${AWS_S3_PRIVATE_BUCKET}/releases/v${{ steps.version.outputs.version }}/"
          aws s3 cp . "s3://${AWS_S3_PRIVATE_BUCKET}/releases/v${{ steps.version.outputs.version }}/" --recursive
          echo "✓ Internal artifacts securely archived to private S3 bucket"

  # Create GitHub Release with artifacts
  create-github-release:
    name: Create GitHub Release
    needs: [build-and-release, build-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version: ' mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          APP_VERSION="${VERSION}+${{ github.run_number }}"
          if [[ "${APP_VERSION}" != v* ]]; then
            VERSION_TAG="v${APP_VERSION}"
          else
            VERSION_TAG="${APP_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download web artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372ca6fa739
        with:
          name: web-release-artifacts
          path: ./artifacts/web

      - name: Download mobile APK artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372ca6fa739
        with:
          name: mobile-apk-artifacts
          path: ./artifacts/mobile

      - name: Download mobile metadata artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372ca6fa739
        with:
          name: mobile-release-artifacts
          path: ./artifacts/mobile

      - name: Verify checksums
        run: |
          echo "=== Verification Checksums ==="
          cat ./artifacts/web/checksums.txt
          echo ""
          cat ./artifacts/mobile/mobile-checksums.txt

      - name: Calculate previous version for changelog
        id: prev_version
        env:
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
        run: |
          PREV_TAG=$(git tag -l 'v*.*.*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' | grep -v "^${VERSION_TAG}$" | head -n1 || echo "")
          if [ -z "$PREV_TAG" ]; then
            PREV_REF=$(git rev-list --max-parents=0 HEAD)
            echo "changelog_text=${PREV_REF}...${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "changelog_text=${PREV_TAG}...${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate verification instructions
        env:
          PLATFORMS: ${{ needs.build-and-release.outputs.platforms }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          DIGEST: ${{ needs.build-and-release.outputs.image_digest }}
          VERSION: ${{ steps.version.outputs.app_version }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          PLATFORM_LIST=$(echo "${PLATFORMS}" | sed 's/linux\///g; s/,/, /g')

          cat > ./artifacts/VERIFY.md << EOF
          # Release Verification Instructions

          This release includes signed web and mobile artifacts with attestations for supply chain security.

          ## Verify Docker Image Signature
          \`\`\`bash
          cosign verify \\
            --certificate-identity-regexp="^https://github.com/${REPOSITORY}" \\
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \\
            ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}
          \`\`\`

          ## Verify Build Attestation
          \`\`\`bash
          gh attestation verify oci://ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG} --owner ${REPOSITORY_OWNER}
          \`\`\`

          ## Verify SBOM Signature
          \`\`\`bash
          cosign verify-blob --bundle sbom.json.bundle sbom.json
          \`\`\`

          ## Verify Checksums
          \`\`\`bash
          sha256sum -c checksums.txt
          sha256sum -c mobile-checksums.txt
          \`\`\`

          ## Verify Mobile APKs
          \`\`\`bash
          gh attestation verify nexus-android-v${VERSION}.apk --owner ${REPOSITORY_OWNER}
          gh attestation verify mec-android-v${VERSION}.apk --owner ${REPOSITORY_OWNER}
          \`\`\`
          EOF

      - name: Create GitHub Release
        env:
          DIGEST: ${{ needs.build-and-release.outputs.image_digest }}
          VERSION_TAG: ${{ steps.version.outputs.version_tag }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SERVER_URL: ${{ github.server_url }}
          CHANGELOG_TEXT: ${{ steps.prev_version.outputs.changelog_text }}
          PLATFORMS: ${{ needs.build-and-release.outputs.platforms }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          PLATFORM_LIST=$(echo "${PLATFORMS}" | sed 's/linux\///g; s/,/, /g')

          gh release create "${VERSION_TAG}" \
            --title "Release ${VERSION_TAG}" \
            --latest \
            --notes "## Release ${VERSION_TAG}

          This release includes:
          - 🐳 Docker image for backend (${PLATFORM_LIST})
          - 📱 Flutter Android APKs (nexus and nexus_mec flavors)
          - 🔐 Signed images and artifacts using cosign
          - 📋 Software Bill of Materials (SBOM) in CycloneDX format
          - ✅ Build provenance attestations
          - 🔍 SHA256 checksums for all artifacts

          ### Docker Images
          \`\`\`bash
          docker pull ghcr.io/${REPOSITORY_OWNER}/${IMAGE_NAME}:${VERSION_TAG}
          \`\`\`
          **Image Digest**: \`${DIGEST}\`

          ### Verification
          See [VERIFY.md](https://github.com/${REPOSITORY}/releases/download/${VERSION_TAG}/VERIFY.md) for detailed verification instructions.

          ---
          **Full Changelog**: ${SERVER_URL}/${REPOSITORY}/compare/${CHANGELOG_TEXT}" \
            ./artifacts/web/sbom.json \
            ./artifacts/web/sbom.json.bundle \
            ./artifacts/web/checksums.txt \
            ./artifacts/VERIFY.md \
            ./artifacts/web/provenance.intoto.jsonl \
            ./artifacts/mobile/nexus-android-v${{ steps.version.outputs.version }}.apk \
            ./artifacts/mobile/mec-android-v${{ steps.version.outputs.version }}.apk \
            ./artifacts/mobile/nexus-sbom.json \
            ./artifacts/mobile/mec-sbom.json \
            ./artifacts/mobile/mobile-checksums.txt \
            --draft=false
