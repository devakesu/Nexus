name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Detect path changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        id: filter
        with:
          filters: |
            python:
              - "app/**"
              - "Nexus_Engine/**"
              - "requirements.txt"
              - "pyrightconfig.json"
              - "pytest.ini"
              - "ruff.toml"
              - ".github/workflows/codeql.yml"
            android:
              - "mobile/android/**"
              - "mobile/lib/**"
              - "mobile/pubspec.yaml"
              - "mobile/pubspec.lock"
              - ".github/workflows/codeql.yml"
            ios:
              - "mobile/ios/**"
              - "mobile/lib/**"
              - "mobile/pubspec.yaml"
              - "mobile/pubspec.lock"
              - ".github/workflows/codeql.yml"

  codeql-python:
    name: CodeQL Python
    needs: detect-changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL (Python)
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          languages: python
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild (Python)
        if: github.event_name == 'push' || needs.detect-changes.outputs.python == 'true'
        uses: github/codeql-action/autobuild@e58424170fb0262c8d7ed60a2e84b9bffe205c67

      - name: Run CodeQL analysis (Python)
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          category: python

  codeql-android:
    name: CodeQL Android (Java/Kotlin)
    needs: detect-changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Download Gradle Wrapper
        if: github.event_name == 'push' || needs.detect-changes.outputs.android == 'true'
        run: |
          mkdir -p mobile/android/gradle/wrapper
          curl -fSL -o mobile/android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  mobile/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          curl -fSL -o mobile/android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew

      - name: Set up JDK 17
        if: github.event_name == 'push' || needs.detect-changes.outputs.android == 'true'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Flutter
        if: github.event_name == 'push' || needs.detect-changes.outputs.android == 'true'
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Prepare google-services.json
        if: github.event_name == 'push' || needs.detect-changes.outputs.android == 'true'
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "✓ Recreated android/app/google-services.json from secret"
          elif [ -f android/app/google-services.json ]; then
            echo "✓ Using checked-in android/app/google-services.json"
          else
            cat > android/app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "nexus-stub-project",
              "storage_bucket": "nexus-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.devakesu.apps.nexus"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:1111111111111111111111",
                  "android_client_info": {
                    "package_name": "com.devakesu.apps.nexus.mec"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDUMMY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
            echo "✓ Created CI stub android/app/google-services.json"
          fi

      - name: Fetch Flutter dependencies
        if: github.event_name == 'push' || needs.detect-changes.outputs.android == 'true'
        working-directory: mobile
        run: flutter pub get

      - name: Install Android SDK (basic)
        if: github.event_name == 'push' || needs.detect-changes.outputs.android == 'true'
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools build-tools;33.0.2 platforms;android-33'

      - name: Initialize CodeQL (Java + Kotlin)
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Build Android app (required for manual CodeQL extraction)
        if: github.event_name == 'push' || needs.detect-changes.outputs.android == 'true'
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Pci

      - name: Run CodeQL analysis (Android)
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          category: java,kotlin

  codeql-ios:
    name: CodeQL iOS (Swift)
    needs: detect-changes
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Flutter
        if: github.event_name == 'push' || needs.detect-changes.outputs.ios == 'true'
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        if: github.event_name == 'push' || needs.detect-changes.outputs.ios == 'true'
        working-directory: mobile
        run: flutter pub get

      - name: Create CI Firebase iOS stub
        if: github.event_name == 'push' || needs.detect-changes.outputs.ios == 'true'
        working-directory: mobile
        run: |
          mkdir -p ios/config/nexus
          cat > ios/config/nexus/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyDUMMY</string>
            <key>BUNDLE_ID</key>
            <string>com.devakesu.apps.nexus</string>
            <key>GCM_SENDER_ID</key>
            <string>123456789012</string>
            <key>GOOGLE_APP_ID</key>
            <string>1:123456789012:ios:0000000000000000000000</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <false/>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>PROJECT_ID</key>
            <string>nexus-stub-project</string>
            <key>STORAGE_BUCKET</key>
            <string>nexus-stub.appspot.com</string>
          </dict>
          </plist>
          EOF

      - name: Cache CocoaPods
        if: github.event_name == 'push' || needs.detect-changes.outputs.ios == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: mobile/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/pubspec.lock', 'mobile/ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        if: github.event_name == 'push' || needs.detect-changes.outputs.ios == 'true'
        working-directory: mobile/ios
        run: pod install

      - name: Initialize CodeQL (Swift)
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          languages: swift
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Build iOS app
        if: github.event_name == 'push' || needs.detect-changes.outputs.ios == 'true'
        run: |
          set -o pipefail
          xcodebuild -workspace mobile/ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run CodeQL analysis (Swift)
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          category: swift
