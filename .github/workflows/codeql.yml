name: "CodeQL Analysis"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  codeql-python:
    name: CodeQL Python
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL (Python)
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          languages: python
          config-file: .github/codeql/codeql-config.yml
          packs: +my-org/python-sanitizers

      - name: Autobuild (Python)
        uses: github/codeql-action/autobuild@e58424170fb0262c8d7ed60a2e84b9bffe205c67

      - name: Run CodeQL analysis (Python)
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          category: python

  codeql-android:
    name: CodeQL Android (Java/Kotlin)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Gradle Wrapper
        run: |
          mkdir -p mobile/android/gradle/wrapper
          curl -fSL -o mobile/android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  mobile/android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          curl -fSL -o mobile/android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew
          chmod +x mobile/android/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: "mobile/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Set up Flutter
        uses: ./.github/actions/flutter-action
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Prepare google-services.json
        working-directory: mobile
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "✓ Recreated android/app/google-services.json from secret"
          elif [ -f android/app/google-services.json ]; then
            echo "✓ Using checked-in android/app/google-services.json"
          else
            node -e '
              const fs = require("fs");
              const stub = {
                project_info: { project_number: "123456789012", project_id: "nexus-stub-project", storage_bucket: "nexus-stub.appspot.com" },
                client: [
                  { client_info: { mobilesdk_app_id: "1:123456789012:android:0000000000000000000000", android_client_info: { package_name: "com.devakesu.apps.nexus" } }, oauth_client: [], api_key: [{ current_key: "AIzaSyDUMMY" }], services: { appinvite_service: { other_platform_oauth_client: [] } } },
                  { client_info: { mobilesdk_app_id: "1:123456789012:android:1111111111111111111111", android_client_info: { package_name: "com.devakesu.apps.nexus.mec" } }, oauth_client: [], api_key: [{ current_key: "AIzaSyDUMMY" }], services: { appinvite_service: { other_platform_oauth_client: [] } } }
                ],
                configuration_version: "1"
              };
              fs.writeFileSync("android/app/google-services.json", JSON.stringify(stub, null, 2));
            '
            echo "✓ Created CI stub android/app/google-services.json"
          fi

      - name: Initialize CodeQL (Java + Kotlin)
        uses: github/codeql-action/init@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml

      - name: Build Android Kotlin source (Triggers CodeQL extraction)
        working-directory: mobile/android
        run: ./gradlew :app:compileNexusDebugSources --no-daemon

      - name: Run CodeQL analysis (Android)
        uses: github/codeql-action/analyze@e58424170fb0262c8d7ed60a2e84b9bffe205c67
        with:
          category: java,kotlin
