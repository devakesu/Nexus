name: Build Guard

on:
  pull_request:
    branches: [main]

  merge_group:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions: {}

jobs:
  guard:
    name: Build Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Import GPG public keys
        run: |
          curl -sL "https://github.com/${{ github.actor }}.gpg" | gpg --import || true
          curl -sL "https://github.com/${{ github.repository_owner }}.gpg" | gpg --import || true

      - name: Verify commit is signed
        run: |
          set -euo pipefail
          git log -1 --show-signature
          SIG_STATUS=$(git log -1 --format='%G?')
          if [ "$SIG_STATUS" != "G" ] && [ "$SIG_STATUS" != "U" ]; then
            echo "::error::Commit HEAD is not signed with a valid GPG key (Status: '$SIG_STATUS')."
            exit 1
          fi
          echo "✓ Commit signature verified successfully (Status: '$SIG_STATUS')."
