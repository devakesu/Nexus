name: "Nexus CodeQL Configuration"

# Restrict CodeQL scanning strictly to application source directories
paths:
  - app
  - Nexus_Engine
  - mocks/Nexus_Engine
  - mobile/android/app/src/main/kotlin

# Explicitly ignore third-party dependencies, generated files, and build caches
paths-ignore:
  - mobile/android/.gradle
  - mobile/android/build
  - '**/GeneratedPluginRegistrant.java'
