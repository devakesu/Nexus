name: "Nexus CodeQL Configuration"

# Restrict CodeQL scanning strictly to application source directories
paths:
  - app
  - Nexus_Engine
  - mobile/android/app/src
  - mobile/ios/Runner

# Explicitly ignore third-party dependencies, generated pods, and build caches
paths-ignore:
  - mobile/android/.gradle
  - mobile/android/build
  - mobile/ios/Pods
  - mobile/ios/.build
  - mobile/ios/DerivedData
