# ruff.toml placed at /nexus/ruff.toml
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "temp",
    "mobile",
]

[lint]
# Select rule sets mirroring strict TypeScript + SonarJS layouts
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (runtime errors)
    "I",   # isort (clean import structures)
    "C90", # McCabe Complexity Gate (catches convoluted code blocks)
    "N",   # PEP8 Naming Conventions (strict casing tracking)
    "UP",  # Python Upgrade tracking (enforces modern language specs)
    "YTT", # sys.version misallocations
    "S",   # Bandersnatch Security Scans (catches SQL Injections, hardcoded keys)
    "BLE", # Blind Exception Catching (forbids raw `except: pass`)
    "B",   # Bugbear (design flaws and bad loop pointer allocations)
    "A",   # Built-in Shadowing protections
    "COM", # Trailing comma enforcements
    "T20", # Forbids raw print statements escaping to production
    "RET", # Return statement structural sanity checks
    "SIM", # Code simplification pipeline (Sonar-style clean metrics)
    "ARG", # Unused arguments checks
    "ERA", # Eradicate (flags commented-out dead code blocks)
    "RUF", # Specific internal Ruff structural enhancements
]

[lint.mccabe]
# Strict complexity limit threshold. Functions with score > 8 will fail validation.
max-complexity = 8

[lint.per-file-ignores]
# Embeds the Meetup Safety trusted-contact portal's HTML/CSS/JS as a raw
# string literal (no frontend build step, per that milestone's design) -
# 88-col wrapping would only hurt the embedded JS/HTML's own readability.
"app/api/safety_portal.py" = ["E501"]
# Same reasoning: the combined Terms of Service / Privacy Policy page is a
# raw HTML/CSS string literal, no template engine or frontend build step.
"app/api/legal.py" = ["E501"]
# Test files: `assert` is the standard pytest idiom (not a production
# assertion that could be optimized away), and `random`/non-crypto RNG is
# fine for generating synthetic layout/fixture data - no security purpose.
"tests/*.py" = ["S101", "S311", "S106", "E501"]
"Nexus_Engine/tests/*.py" = ["S101", "S311", "S106", "E501"]
# FastAPI route parameter defaults use Body(), Depends(), Query(), File()
"app/api/*.py" = ["B008"]
# Command-line utility scripts print output and invoke subprocess
"scripts/*.py" = ["T201", "S603"]
# Backend app and engine code docstrings line length
"app/**/*.py" = ["E501"]
"Nexus_Engine/**/*.py" = ["E501", "N999"]
